  # dockhand:
  #   image: fnsys/dockhand:latest
  #   container_name: dockhand
  #   restart: unless-stopped
  #   # ports:
  #   #   - 3000:3000
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - $APPDATA/dockhand:/app/data
  #   labels:
  #     caddy: docker.bradserver.dev
  #     caddy.reverse_proxy: "{{upstreams 3000}}"


  upsnap:
    container_name: upsnap
    image: ghcr.io/seriousm4x/upsnap:5 # images are also available on docker hub: seriousm4x/upsnap:4
    network_mode: host
    restart: unless-stopped
    volumes:
      - $APPDATA/upsnap/data:/app/pb_data
    # # To use a non-root user, create the mountpoint first (mkdir data) so that it has the right permission.
    # user: 0:0
    environment:
      - TZ=America/Edmonton # Set container timezone for cron schedules
      - UPSNAP_INTERVAL=*/10 * * * * * # Sets the interval in which the devices are pinged
      - UPSNAP_SCAN_RANGE=192.168.0.0/24 # Scan range is used for device discovery on local network
    #   - UPSNAP_SCAN_TIMEOUT=500ms # Scan timeout is nmap's --host-timeout value to wait for devices (https://nmap.org/book/man-performance.html)
      - UPSNAP_PING_PRIVILEGED=true # Set to false if you don't have root user permissions
    #   - UPSNAP_WEBSITE_TITLE=Custom name # Custom website title
    # # dns is used for name resolution during network scan
    dns:
      - 192.168.0.1
    #   - 192.18.0.2
    # UpSnap v5 listens on 8090 in this image; keep upstream and healthcheck aligned.
    healthcheck:
      test: curl -fs "http://172.17.0.1:8090/api/health" || exit 1
      interval: 10s
    # # or install custom packages for shutdown
    # entrypoint: /bin/sh -c "apk update && apk add --no-cache <YOUR_PACKAGE> && rm -rf /var/cache/apk/* && ./upsnap serve --http 0.0.0.0:8090"
    labels:
      caddy: upsnap.bradserver.dev
      caddy.reverse_proxy: 172.17.0.1:8090


######### Scrutiny ###############
  influxdb:
    image: influxdb:2.2
    container_name: scrutinydb
    networks:
        - proxy-net
    ports:
      - '18086:8086'
    volumes:
      - $APPDATA/scrutinydb:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 5s
      timeout: 10s
      retries: 20
  scrutiny:
    image: 'ghcr.io/analogj/scrutiny:master-web'
    container_name: scrutiny
    networks:
        - proxy-net
    ports:
      - '18080:8080'
    volumes:
      - $APPDATA/scrutiny:/opt/scrutiny/config
    environment:
      SCRUTINY_WEB_INFLUXDB_HOST: 'influxdb'
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    labels:
      caddy: scrutiny.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"
  collector:
    image: 'ghcr.io/analogj/scrutiny:master-collector'
    networks:
        - proxy-net
    container_name: scrutiny-collector
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - '/run/udev:/run/udev:ro'
    environment:
      COLLECTOR_API_ENDPOINT: 'http://scrutiny:8080'
      COLLECTOR_HOST_ID: 'media-server'
    depends_on:
      scrutiny:
        condition: service_healthy
    devices:
      - "/dev/sda"
      - "/dev/sdb"
      - "/dev/sdc"
      - "/dev/sdd"
      - "/dev/sde"
      - "/dev/sdf"
      - "/dev/nvme0"
    ############################

  watchtower:
    image:  nickfedor/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  qdirstat:
    image: jlesage/qdirstat
    container_name: qdirstat
    networks:
      - proxy-net
    restart: unless-stopped
    ports:
      - "5800:5800"
    volumes:
      - "$APPDATA/qdirstat:/config:rw"
      - "/home/brad:/storage:ro"
    # labels: no security
    #   caddy: drives.bradserver.dev
    #   caddy.reverse_proxy: "{{upstreams 5800}}"

  glances:
    # See all images tags here: https://hub.docker.com/r/nicolargo/glances/tags
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: always

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:61208/api/4/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    pid: "host"
    network_mode: "host"

    read_only: true
    privileged: false
    # Uncomment next line for SATA or NVME smartctl monitoring
    # cap_add:
      # Uncomment next line for SATA smartctl monitoring
      # - SYS_RAWIO
      # Uncomment next line for NVME smartctl monitoring
      # - SYS_ADMIN
    # devices:
    #   - "/dev/nvme0"

    volumes:
      - "/:/rootfs:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      # Uncomment for qemu/libvirt/kvm support with modular libvirt daemons
      # - "/var/run/libvirt/virtqemud-sock:/var/run/libvirt/libvirt-sock:ro"
      # OR monolithic libvirt daemon
      # - "/var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock:ro"
      - "/run/user/1000/podman/podman.sock:/run/user/1000/podman/podman.sock:ro"
      - "./glances.conf:/glances/conf/glances.conf"
      # Uncomment for proper distro information in upper panel.
#     # Works only for distros that do have this file (most of distros do).
#      - "/etc/os-release:/etc/os-release:ro"

    tmpfs:
      - /tmp

    environment:
      - GLANCES_OPT=-C /glances/conf/glances.conf -w --enable-mcp --enable-plugin smart
      # Please set to your local timezone (or use local ${TZ} environment variable if set on your host)
      - TZ=America/Edmonton
      - PYTHONPYCACHEPREFIX=/tmp/py_caches

    # Uncomment for GPU compatibility (Nvidia) inside the container
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Uncomment to protect Glances WebUI by a login/password (add --password to GLANCES_OPT)
    # secrets:
    #   - source: glances_password
    #     target: /root/.config/glances/<login>.pwd

volumes:
  database:
    driver: local
  redis:
    driver: local
