  #     # ❌❌❌❌ WRONG: - /docker:/my-stacks (Both paths do not match)
  #     - $DOCKERDIR/compose:$DOCKERDIR/compose
  #   environment:
  #     # Tell Dockge where is your stacks directory
  #     - DOCKGE_STACKS_DIR=$DOCKERDIR/compose
