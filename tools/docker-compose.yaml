
networks:
  default:
  proxy-net:
    name: proxy-net
    external: true

services:

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - $APPDATA/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.5:3000 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts


  db_recipes:
    container_name: tandoor_db
    restart: always
    image: postgres:16-alpine
    volumes:
      - $APPDATA/tandoor/data:/var/lib/postgresql/data
    env_file:
      - ./.env
      - ./.env-tandoor
    networks:
      - default

  web_recipes:
    container_name: tandoor
    restart: always
    image: vabene1111/recipes
    ports:
      - 10380:80
    env_file:
      - ./.env
      - ./.env-tandoor
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - $APPDATA/tandoor/mediafiles:/opt/recipes/mediafiles
      # Host-header-ordering fix so Cloudflare doesn't 403 recipe URL imports.
      # See the docstring in sitecustomize.py. Path pins python3.13 - if a future
      # image bumps Python, update this or imports start 403ing again.
      - $APPDATA/tandoor/patches/sitecustomize.py:/opt/recipes/venv/lib/python3.13/site-packages/sitecustomize.py:ro
    depends_on:
      - db_recipes
    networks:
      - default
      - proxy-net
    labels:
      caddy: recipes.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 80}}"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://vw.bradserver.dev"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - $APPDATA/vaultwarden:/data/
    ports:
      - 11001:80
    networks:
      - proxy-net
    labels:
      caddy: vw.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 80}}"


  donetick:
    image: donetick/donetick
    container_name: donetick
    networks:
      - proxy-net
    restart: unless-stopped
    ports:
      - 2021:2021
    volumes:
      - $APPDATA/donetick/data:/donetick-data
      - $APPDATA/donetick/config:/config
    environment:
      - DT_ENV=selfhosted
      - DT_SQLITE_PATH=/donetick-data/donetick.db
      - DT_JWT_SECRET=${DONETICK_JWT_SECRET}
      - TZ=Etc/UTC
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:2021/api/v1/health || exit 1
      start_period: 1m
      timeout: 5s
      interval: 1m
      retries: 3
    labels:
      caddy: donetick.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 2021}}"

