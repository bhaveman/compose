
networks:
  default:
  proxy-net:
    name: proxy-net
    external: true

services:

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - $APPDATA/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.0.5:3000 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts


  db_recipes:
    container_name: tandoor_db
    restart: always
    image: postgres:16-alpine
    volumes:
      - $APPDATA/tandoor/data:/var/lib/postgresql/data
    env_file:
      - ./.env
      - ./.env-tandoor
    networks:
      - default

  web_recipes:
    container_name: tandoor
    restart: always
    image: vabene1111/recipes
    ports:
      - 10380:80
    env_file:
      - ./.env
      - ./.env-tandoor
    volumes:
      - staticfiles:/opt/recipes/staticfiles
      - $APPDATA/tandoor/mediafiles:/opt/recipes/mediafiles
      # Host-header-ordering fix so Cloudflare doesn't 403 recipe URL imports.
      # See the docstring in sitecustomize.py. Path pins python3.13 - if a future
      # image bumps Python, update this or imports start 403ing again.
      - $APPDATA/tandoor/patches/sitecustomize.py:/opt/recipes/venv/lib/python3.13/site-packages/sitecustomize.py:ro
    depends_on:
      - db_recipes
    networks:
      - default
      - proxy-net
    labels:
      caddy: recipes.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 80}}"

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: always
    environment:
      DOMAIN: "https://vw.bradserver.dev"
      SIGNUPS_ALLOWED: "false"
    volumes:
      - $APPDATA/vaultwarden:/data/
    ports:
      - 11001:80
    networks:
      - proxy-net
    labels:
      caddy: vw.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 80}}"

  actual_server:
    container_name: actual-server
    image: docker.io/actualbudget/actual-server:latest
    networks:
      - proxy-net
    #environment:
      # Uncomment any of the lines below to set configuration options.
      # - ACTUAL_HTTPS_KEY=/data/selfhost.key
      # - ACTUAL_HTTPS_CERT=/data/selfhost.crt
      # - ACTUAL_PORT=5006
      # - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
      # - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
      # - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
      # See all options and more details at https://actualbudget.org/docs/config/
      # !! If you are not using any of these options, remove the 'environment:' tag entirely.
    volumes:
      # Change './actual-data' below to the path to the folder you want Actual to store its data in on your server.
      # '/data' is the path Actual will look for its files in by default, so leave that as-is.
      - $APPDATA/actual-budget:/data
    healthcheck:
      # Enable health check for the instance
      test: ['CMD-SHELL', 'node scripts/health-check.js']
      # health check using self signed certs
      # test: ['CMD-SHELL', 'NODE_EXTRA_CA_CERTS=/data/selfhost.crt node scripts/health-check.js']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    labels:
      caddy: budget.bradserver.dev
      caddy.reverse_proxy: "{{upstreams 5006}}"

volumes:
  staticfiles:

